[project]
name = "soriham-stt"
version = "0.1.0"
description = "소리함 변환 러너: whisper STT + 화자분리, HTTP 잡 API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52",
]

[project.optional-dependencies]
mlx = [
    "mlx-whisper>=0.4.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
cpu = [
    "faster-whisper>=1.2",
]
diarize = [
    "pyannote.audio>=4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "ruff>=0.16",
]

# 리눅스(도커 CPU 이미지)에서 torch 계열이 CUDA 휠로 풀리지 않도록 CPU 인덱스 고정
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchcodec = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "soriham_stt"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
