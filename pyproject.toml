[project]
name = "soriham-stt"
version = "0.1.0"
description = "소리함 변환 러너: whisper STT + 화자분리, HTTP 잡 API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52",
]

[project.optional-dependencies]
mlx = [
    "mlx-whisper>=0.4.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
# 백엔드 extra가 torch 계열의 인덱스까지 정한다. 전이 의존성에는 소스 지정이 안 붙으므로
# 아래 tool.uv.sources를 받으려면 여기에 직접 적혀 있어야 한다
cpu = [
    "faster-whisper>=1.2",
    "torch",
    "torchaudio",
    "torchcodec",
]
cuda = [
    "faster-whisper>=1.2",
    "torch",
    "torchaudio",
    "torchcodec",
    # torchcodec의 CUDA 빌드가 libnppicc를 dlopen하는데 torch는 npp를 안 끌고 온다.
    # 없으면 torchcodec import가 실패하고, 화자분리가 오디오를 못 읽는다
    "nvidia-npp-cu12; sys_platform == 'linux'",
]
diarize = [
    "pyannote.audio>=4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "ruff>=0.16",
]

# 백엔드 extra는 동시에 켤 수 없다. torch 계열이 인덱스마다 다른 빌드라 한 환경에
# 둘 다 풀 수 없기 때문이다
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# CUDA 12.8. 기본 인덱스의 torch는 CUDA 13 빌드인데 ctranslate2(faster-whisper)는
# CUDA 12 라이브러리(libcublas.so.12, libcudnn.so.9)를 dlopen하므로 같이 못 쓴다.
# cu126은 sm_120(Blackwell) 커널이 없어 최신 GPU에서 torch가 못 돈다
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# 백엔드 extra로 인덱스를 고른다. 아무것도 안 고르면(맥의 mlx 경로) 기본 인덱스에서
# 받는다. CUDA 휠은 맥에 없으므로 인덱스 고정에서 뺀다
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform != 'darwin'" },
]
torchcodec = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform != 'darwin'" },
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "soriham_stt"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
